<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TITLE (Google + browser tab) -->
    <title>MissionSidewalk — Discover Local Events, Parties & Culture</title>

    <!-- SEO DESCRIPTION (Google Search snippet) -->
    <meta
      name="description"
      content="Discover local parties, live shows, cultural events and unique experiences near you. MissionSidewalk connects people to their city's best events."
    />

    <!-- KEYWORDS -->
    <meta
      name="keywords"
      content="local events, parties, live music, cultural events, things to do, event discovery, nightlife, art shows, festivals"
    />

    <!-- ROBOTS -->
    <meta name="robots" content="index, follow" />

    <!-- CANONICAL -->
    <link rel="canonical" href="https://www.missionsidewalk.com/" />

    <!-- OPEN GRAPH (WhatsApp, Instagram, Facebook, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.missionsidewalk.com/" />
    <meta
      property="og:title"
      content="MissionSidewalk — Create & Discover Local Events"
    />
    <meta
      property="og:description"
      content="Create private events, invite your crew and discover live shows, parties, art, culture and unique experiences happening in your city."
    />
    <meta
      property="og:image"
      content="https://www.missionsidewalk.com/og-image.jpg"
    />
    <meta property="og:site_name" content="MissionSidewalk" />
    <meta property="og:locale" content="en_US" />

    <!-- TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MissionSidewalk — Local Event Discovery"
    />
    <meta
      name="twitter:description"
      content="Find and create local events, parties, shows and cultural experiences in one place."
    />
    <meta
      name="twitter:image"
      content="https://www.missionsidewalk.com/og-image.jpg"
    />

    <!-- FAVICON -->
    <link rel="icon" href="/favicon.ico" />

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
